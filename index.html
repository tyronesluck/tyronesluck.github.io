<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TyronesLuck</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0d0d;
            color: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            text-decoration: none;
            transition: 0.2s ease;
        }

        a:hover {
            background: #252525;
            border-color: #555;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 60px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>TyronesLuck</h1>

        <p class="subtitle">
            Games, projects and other stuff.
        </p>

        <div class="buttons">
            <a href="/games/">Games</a>
            <a href="https://github.com/tyronesluck" target="_blank">GitHub</a>
        </div>

        <footer>
            © 2026 TyronesLuck
        </footer>

    </main>

</body>
</html>
