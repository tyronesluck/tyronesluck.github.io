<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>NEON SERPENT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -20%, #0d3b2e 0%, #05060f 55%) fixed;
    color: #eaf7ff;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #stage { position: relative; line-height: 0; touch-action: none; }
  canvas {
    display: block; border-radius: 14px; background: #070a18;
    box-shadow: 0 0 30px rgba(0,255,159,.16), 0 0 90px rgba(255,45,149,.10);
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; pointer-events: none; line-height: 1.4;
    font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
  }
  .hud-label { color: #5f7fae; margin-right: 6px; }
  #score, #hiScore { color: #fff; text-shadow: 0 0 8px rgba(0,255,159,.9); font-weight: 600; }
  #lenTag { color: #00ff9f; text-shadow: 0 0 10px rgba(0,255,159,.7); }
  .hud-right { display: flex; align-items: center; gap: 14px; }
  #muteBtn {
    pointer-events: auto; cursor: pointer; background: none; border: 1px solid #2b3a6e;
    color: #eaf7ff; border-radius: 8px; padding: 4px 9px; font-size: 14px; line-height: 1;
  }
  #muteBtn:hover { border-color: #00ff9f; box-shadow: 0 0 10px rgba(0,255,159,.4); }
  #overlay {
    position: absolute; inset: 0; z-index: 3; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-align: center; line-height: 1.5; padding: 20px;
    background: rgba(5,7,18,.78); backdrop-filter: blur(3px);
    pointer-events: none;
  }
  #overlay.hidden { display: none; }
  #overlay.ghost { background: rgba(5,7,18,.25); }
  #overlay h1 {
    font-size: clamp(30px, 6vw, 46px); letter-spacing: .22em; color: #fff;
    text-shadow: 0 0 14px var(--c, #00ff9f), 0 0 44px rgba(0,255,159,.55);
  }
  #overlay p { font-size: 15px; color: #9fb3d8; letter-spacing: .06em; }
  #overlay .big { font-size: 20px; color: #fff; text-shadow: 0 0 10px rgba(0,255,159,.8); }
  #overlay p.blink {
    font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #ff7ac0;
    text-shadow: 0 0 10px rgba(255,45,149,.8); animation: blinkPulse 1.1s ease-in-out infinite;
  }
  @keyframes blinkPulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  #hint { font-size: 12px; letter-spacing: .14em; color: #4d6494; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div><span class="hud-label">Score</span><span id="score">0</span>&nbsp;&nbsp;<span class="hud-label">Best</span><span id="hiScore">0</span></div>
    <div id="lenTag">Length 3</div>
    <div class="hud-right"><button id="muteBtn" title="Mute (M)">🔊</button></div>
  </div>
  <div id="overlay">
    <h1>NEON SERPENT</h1>
    <p class="big">Eat. Grow. Don't bite yourself.</p>
    <p>&larr; &uarr; &darr; &rarr; / WASD to steer &middot; swipe on touch<br>P pause &middot; M mute</p>
  </div>
</div>
<div id="hint">Arrows / WASD — steer &middot; Space / click — start &amp; restart &middot; P — pause &middot; M — mute</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const elScore = document.getElementById('score');
const elHi = document.getElementById('hiScore');
const elLen = document.getElementById('lenTag');
const muteBtn = document.getElementById('muteBtn');

// ---- Grid / world ---------------------------------------------------------
const CELL = 20, COLS = 32, ROWS = 22;
const W = COLS * CELL, H = ROWS * CELL;

let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const availW = window.innerWidth - 32;
  const availH = window.innerHeight - 90;
  scale = Math.max(0.4, Math.min(availW / W, availH / H, 1.35));
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
}
window.addEventListener('resize', resize);

// ---- Audio ------------------------------------------------------------------
let audioCtx = null, muted = false;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol, slideTo) {
  if (!audioCtx || muted) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(vol || 0.12, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const sfx = {
  eat()   { beep(540, 0.09, 'square', 0.10, 760); },
  bonus() { beep(880, 0.08, 'triangle', 0.12); setTimeout(() => beep(1320, 0.12, 'triangle', 0.12), 70); },
  die()   { beep(220, 0.45, 'sawtooth', 0.16, 55); },
  start() { beep(330, 0.12, 'triangle', 0.12, 660); }
};

// ---- State ------------------------------------------------------------------
const KEY_BEST = 'neonSerpentBest';
let best = parseInt(localStorage.getItem(KEY_BEST) || '0', 10) || 0;
elHi.textContent = best;

let state = 'menu';           // menu | playing | paused | dying | over
let snake, prevSnake, dirQueue, lastDir;
let stepMs, acc, score, foodEaten;
let food, bonus;              // {x,y} grid coords; bonus: {x,y,tLeft,tMax}
let particles = [], popups = [];
let shakeT = 0, flashT = 0, dieTimer = 0;

function reset() {
  snake = [{ x: 8, y: Math.floor(ROWS / 2) },
           { x: 7, y: Math.floor(ROWS / 2) },
           { x: 6, y: Math.floor(ROWS / 2) }];
  prevSnake = snake.map(c => ({ ...c }));
  dirQueue = []; lastDir = { x: 1, y: 0 };
  stepMs = 150; acc = 0; score = 0; foodEaten = 0;
  bonus = null; particles = []; popups = [];
  shakeT = 0; flashT = 0; dieTimer = 0;
  spawnFood();
  updateHud();
}

function freeCell() {
  const taken = new Set(snake.map(c => c.x + ',' + c.y));
  if (food) taken.add(food.x + ',' + food.y);
  if (bonus) taken.add(bonus.x + ',' + bonus.y);
  let x, y, tries = 0;
  do {
    x = Math.floor(Math.random() * COLS);
    y = Math.floor(Math.random() * ROWS);
  } while (taken.has(x + ',' + y) && ++tries < 500);
  return { x, y };
}
function spawnFood() { food = freeCell(); }

function updateHud() {
  elScore.textContent = score;
  elHi.textContent = best;
  elLen.textContent = 'Length ' + snake.length;
}

// ---- Input ------------------------------------------------------------------
const DIRS = { ArrowUp: {x:0,y:-1}, KeyW: {x:0,y:-1}, ArrowDown: {x:0,y:1}, KeyS: {x:0,y:1},
               ArrowLeft: {x:-1,y:0}, KeyA: {x:-1,y:0}, ArrowRight: {x:1,y:0}, KeyD: {x:1,y:0} };

function queueDir(d) {
  const ref = dirQueue.length ? dirQueue[dirQueue.length - 1] : lastDir;
  if (d.x === -ref.x && d.y === -ref.y) return;   // no 180° reversal
  if (d.x === ref.x && d.y === ref.y) return;     // same direction, ignore
  if (dirQueue.length < 2) dirQueue.push(d);
}

function startGame() {
  ensureAudio();
  reset();
  state = 'playing';
  overlay.classList.add('hidden');
  sfx.start();
}
function pauseToggle() {
  if (state === 'playing') {
    state = 'paused';
    showOverlay('PAUSED', null, null, true);
  } else if (state === 'paused') {
    state = 'playing';
    overlay.classList.add('hidden');
  }
}
function gameOver() {
  state = 'dying';
  shakeT = 0.5; flashT = 0.35; dieTimer = 0.9;
  sfx.die();
  burst(cellX(snake[0]), cellY(snake[0]), '#ff2d95', 40);
}

function showOverlay(title, big, sub, ghost, color) {
  overlay.classList.remove('hidden');
  overlay.classList.toggle('ghost', !!ghost);
  overlay.style.setProperty('--c', color || (ghost ? '#ffb400' : '#00ff9f'));
  overlay.innerHTML = '<h1>' + title + '</h1>' +
    (big ? '<p class="big">' + big + '</p>' : '') +
    (sub ? '<p>' + sub + '</p>' : '');
}

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  ensureAudio();
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (state === 'menu' || state === 'over') {
    if (e.code === 'Space' || e.code === 'Enter') { startGame(); return; }
  }
  if (e.code === 'KeyP' && (state === 'playing' || state === 'paused')) { pauseToggle(); return; }
  const d = DIRS[e.code];
  if (d) {
    e.preventDefault();
    if (state === 'menu') startGame();
    if (state === 'playing') queueDir(d);
  }
});

// Touch: swipe to steer, tap to start/restart
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  ensureAudio();
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if (state === 'menu' || state === 'over') { startGame(); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return; // tap, not swipe
  queueDir(Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx), y: 0 } : { x: 0, y: Math.sign(dy) });
}, { passive: true });

canvas.addEventListener('click', () => {
  ensureAudio();
  if (state === 'menu' || state === 'over') startGame();
  else if (state === 'paused') pauseToggle();
});

function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
}
muteBtn.addEventListener('click', e => { e.stopPropagation(); ensureAudio(); toggleMute(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing') pauseToggle();
});

// ---- Particles / popups -----------------------------------------------------
function cellX(c) { return c.x * CELL + CELL / 2; }
function cellY(c) { return c.y * CELL + CELL / 2; }

function burst(px, py, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 160;
    particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                     life: 0.5 + Math.random() * 0.4, maxLife: 0.9, color, r: 1.5 + Math.random() * 2.5 });
  }
}
function popup(px, py, text, color) {
  popups.push({ x: px, y: py, text, color, life: 0.8 });
}

// ---- Step logic -------------------------------------------------------------
function step() {
  prevSnake = snake.map(c => ({ ...c }));
  if (dirQueue.length) lastDir = dirQueue.shift();

  const head = snake[0];
  const nx = head.x + lastDir.x, ny = head.y + lastDir.y;

  // Wall collision
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver(); return; }

  const eating = food && nx === food.x && ny === food.y;
  const bonusHit = bonus && nx === bonus.x && ny === bonus.y;

  // Self collision (tail cell is safe if it moves away this tick)
  const bodyLen = eating ? snake.length : snake.length - 1;
  for (let i = 0; i < bodyLen; i++) {
    if (snake[i].x === nx && snake[i].y === ny) { gameOver(); return; }
  }

  snake.unshift({ x: nx, y: ny });
  if (!eating) snake.pop();

  if (eating) {
    score += 10; foodEaten++;
    sfx.eat();
    burst(cellX(nx), cellY(ny), '#ff2d95', 18);
    popup(cellX(nx), cellY(ny), '+10', '#ff7ac0');
    spawnFood();
    stepMs = Math.max(70, stepMs - 4);
    if (foodEaten % 5 === 0 && !bonus) {
      bonus = Object.assign(freeCell(), { tLeft: 6, tMax: 6 });
    }
  }
  if (bonusHit) {
    score += 50;
    sfx.bonus();
    burst(cellX(nx), cellY(ny), '#ffb400', 30);
    popup(cellX(nx), cellY(ny), '+50', '#ffd27a');
    bonus = null;
  }
  if (score > best) { best = score; localStorage.setItem(KEY_BEST, String(best)); }
  updateHud();
}

// ---- Update / render --------------------------------------------------------
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state === 'playing') {
    acc += dt * 1000;
    while (acc >= stepMs && state === 'playing') { acc -= stepMs; step(); }
    if (bonus) {
      bonus.tLeft -= dt;
      if (bonus.tLeft <= 0) { burst(cellX(bonus), cellY(bonus), '#ffb400', 12); bonus = null; }
    }
  } else if (state === 'dying') {
    dieTimer -= dt;
    if (dieTimer <= 0) {
      state = 'over';
      showOverlay('YOU CRASHED', 'Score ' + score, null, false, '#ff2d95');
      const p = document.createElement('p');
      p.className = 'blink';
      p.textContent = 'Press SPACE or click to restart';
      overlay.appendChild(p);
    }
  }

  // particles & popups always animate
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life -= dt; p.y -= 30 * dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
  shakeT = Math.max(0, shakeT - dt);
  flashT = Math.max(0, flashT - dt);

  render(now / 1000);
  requestAnimationFrame(frame);
}

function lerpCell(a, b, t) {
  return { x: (a.x + (b.x - a.x) * t) * CELL + CELL / 2,
           y: (a.y + (b.y - a.y) * t) * CELL + CELL / 2 };
}

function render(time) {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // shake
  if (shakeT > 0) {
    const m = shakeT * 14;
    ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
  }

  // grid
  ctx.strokeStyle = 'rgba(0,255,159,.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = CELL; x < W; x += CELL) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = CELL; y < H; y += CELL) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();

  // wall glow
  ctx.strokeStyle = 'rgba(0,255,159,.35)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00ff9f'; ctx.shadowBlur = 12;
  ctx.strokeRect(1, 1, W - 2, H - 2);
  ctx.shadowBlur = 0;

  if (state === 'menu') return; // overlay covers it

  const t = state === 'playing' ? Math.min(acc / stepMs, 1) : 1;

  // food
  if (food) {
    const pulse = 6.5 + Math.sin(time * 5) * 1.3;
    ctx.shadowColor = '#ff2d95'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff2d95';
    ctx.beginPath(); ctx.arc(cellX(food), cellY(food), pulse, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(cellX(food) - 2, cellY(food) - 2.5, pulse * 0.32, 0, Math.PI * 2); ctx.fill();
  }

  // bonus food (gold diamond + timer ring)
  if (bonus) {
    const bx = cellX(bonus), by = cellY(bonus);
    const s = 7 + Math.sin(time * 8) * 1.5;
    ctx.save();
    ctx.translate(bx, by); ctx.rotate(time * 2);
    ctx.shadowColor = '#ffb400'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#ffb400';
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,180,0,.7)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(bx, by, CELL * 0.75, -Math.PI / 2, -Math.PI / 2 + (bonus.tLeft / bonus.tMax) * Math.PI * 2);
    ctx.stroke();
  }

  // snake: smooth polyline through interpolated centers
  const pts = [];
  for (let i = 0; i < snake.length; i++) {
    const from = prevSnake[i] || snake[i];
    pts.push(lerpCell(from, snake[i], t));
  }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // glow pass
  ctx.shadowColor = '#00ff9f'; ctx.shadowBlur = 18;
  ctx.strokeStyle = '#00c47a';
  ctx.lineWidth = CELL * 0.82;
  strokePath(pts);
  // core pass
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#00ff9f';
  ctx.lineWidth = CELL * 0.5;
  strokePath(pts);

  // head + eyes
  const hp = pts[0];
  ctx.fillStyle = '#baffef';
  ctx.beginPath(); ctx.arc(hp.x, hp.y, CELL * 0.42, 0, Math.PI * 2); ctx.fill();
  const ex = lastDir.x * 3, ey = lastDir.y * 3;
  const px = -lastDir.y * 4.5, py = lastDir.x * 4.5;
  ctx.fillStyle = '#06140d';
  ctx.beginPath(); ctx.arc(hp.x + ex + px, hp.y + ey + py, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hp.x + ex - px, hp.y + ey - py, 2.4, 0, Math.PI * 2); ctx.fill();

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // score popups
  ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life / 0.8);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fillText(p.text, p.x, p.y - 12);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  // death flash
  if (flashT > 0) {
    ctx.fillStyle = 'rgba(255,45,149,' + (flashT * 0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

function strokePath(pts) {
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

// ---- Boot -------------------------------------------------------------------
resize();
reset();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
