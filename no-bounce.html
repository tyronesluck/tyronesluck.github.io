<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>NEON BREAKER</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -20%, #141a4d 0%, #05060f 55%) fixed;
    color: #eaf7ff;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #stage { position: relative; line-height: 0; touch-action: none; }
  canvas {
    display: block; border-radius: 14px; background: #070a18;
    box-shadow: 0 0 30px rgba(0,229,255,.16), 0 0 90px rgba(255,45,149,.10);
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px; pointer-events: none; line-height: 1.4;
    font-size: 14px; letter-spacing: .14em; text-transform: uppercase;
  }
  .hud-label { color: #5f7fae; margin-right: 6px; }
  #score, #hiScore { color: #fff; text-shadow: 0 0 8px rgba(0,229,255,.9); font-weight: 600; }
  #levelTag { color: #ffb400; text-shadow: 0 0 10px rgba(255,180,0,.7); }
  .hud-right { display: flex; align-items: center; gap: 14px; }
  #lives { color: #ff2d95; letter-spacing: .3em; text-shadow: 0 0 8px rgba(255,45,149,.8); font-size: 16px; min-width: 70px; }
  #muteBtn {
    pointer-events: auto; cursor: pointer; background: none; border: 1px solid #2b3a6e;
    color: #eaf7ff; border-radius: 8px; padding: 4px 9px; font-size: 14px; line-height: 1;
  }
  #muteBtn:hover { border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,.4); }
  #overlay {
    position: absolute; inset: 0; z-index: 3; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    text-align: center; line-height: 1.5; padding: 20px;
    background: rgba(5,7,18,.78); backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }
  #overlay.ghost { background: rgba(5,7,18,.25); }
  #overlay h1 {
    font-size: clamp(30px, 6vw, 46px); letter-spacing: .22em; color: #fff;
    text-shadow: 0 0 14px var(--c, #00e5ff), 0 0 44px rgba(0,229,255,.55);
  }
  #overlay p { font-size: 15px; color: #9fb3d8; letter-spacing: .06em; }
  #overlay .big { font-size: 20px; color: #fff; text-shadow: 0 0 10px rgba(0,229,255,.8); }
  #hint { font-size: 12px; letter-spacing: .14em; color: #4d6494; text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">
    <div><span class="hud-label">Score</span><span id="score">0</span>&nbsp;&nbsp;<span class="hud-label">Best</span><span id="hiScore">0</span></div>
    <div id="levelTag">Level 1</div>
    <div class="hud-right"><span id="lives"></span><button id="muteBtn" title="Mute (M)">🔊</button></div>
  </div>
  <div id="overlay">
    <h1>NEON BREAKER</h1>
    <p class="big">Smash the grid. Keep the ball alive.</p>
    <p>Mouse / &larr; &rarr; to move &middot; Space or click to launch<br>P pause &middot; M mute</p>
  </div>
</div>
<div id="hint">Space / click — start &amp; launch &middot; P — pause &middot; M — mute</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const elScore = document.getElementById('score');
const elHi = document.getElementById('hiScore');
const elLevel = document.getElementById('levelTag');
const elLives = document.getElementById('lives');
const muteBtn = document.getElementById('muteBtn');

const W = 800, H = 640;
let dpr = 1;
function fit(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.max(0.35, Math.min((innerWidth - 24) / W, (innerHeight - 90) / H, 1.2));
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
}
addEventListener('resize', fit);
fit();

// ---------------- audio ----------------
let audioCtx = null, muted = false;
function ensureAudio(){
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ /* noop */ } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur = 0.08, type = 'square', vol = 0.12, slideTo = null){
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfx = {
  paddle(){ beep(240, .07, 'square', .1); },
  brick(){ beep(480 + Math.random() * 320, .06, 'sawtooth', .09); },
  hard(){ beep(300, .05, 'triangle', .1); },
  power(){ beep(660, .07, 'square', .1); setTimeout(() => beep(990, .09, 'square', .1), 70); },
  life(){ [392, 494, 587].forEach((f, i) => setTimeout(() => beep(f, .09, 'triangle', .12), i * 90)); },
  lose(){ beep(220, .35, 'sawtooth', .16, 60); },
  clear(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .1, 'square', .1), i * 100)); },
  over(){ [330, 262, 196, 131].forEach((f, i) => setTimeout(() => beep(f, .14, 'sawtooth', .12), i * 130)); }
};

// ---------------- state ----------------
const S = { MENU: 0, READY: 1, PLAYING: 2, OVER: 3, CLEAR: 4 };
let state = S.MENU;
let paused = false;
let score = 0, hi = 0;
try { hi = +(localStorage.getItem('neonBreakerHi') || 0); } catch(e){ /* noop */ }
let lives = 3, level = 1, speed = 340;
let shake = 0, clearT = 0;

const paddle = { x: W / 2, w: 120, h: 14, y: H - 46 };
let expandT = 0, slowT = 0;
let balls = [], bricks = [], powerups = [], particles = [];
const keys = { left: false, right: false };
let pointerX = W / 2;

// ---------------- levels ----------------
const COLS = 10, SIDE = 24, GAP = 8, TOP = 96;
const PALETTE = ['#00e5ff', '#2dffc4', '#b8ff2d', '#ffb400', '#ff7a1a', '#ff2d95'];
function brickW(){ return (W - SIDE * 2 - GAP * (COLS - 1)) / COLS; }

const PATTERNS = [
  ['xxxxxxxxxx','xxxxxxxxxx','xxxxxxxxxx','xxxxxxxxxx'],
  ['x.x.x.x.x.','.x.x.x.x.x','x.x.x.x.x.','.x.x.x.x.x','x.x.x.x.x.'],
  ['..xxxxxx..','.xxxxxxxx.','xxxxxxxxxx','.xxxxxxxx.','..xxxxxx..']
];

function buildLevel(n){
  bricks = []; powerups = []; particles = [];
  const bw = brickW(), bh = 26;
  let grid;
  if (n <= PATTERNS.length) {
    grid = PATTERNS[n - 1].map(row => row.split(''));
  } else {
    const rows = Math.min(5 + Math.floor((n - 3) / 2), 7);
    grid = [];
    for (let r = 0; r < rows; r++){
      const row = [];
      for (let c = 0; c < COLS; c++) row.push(Math.random() < 0.6 ? 'x' : '.');
      grid.push(row);
    }
  }
  const hardP = Math.min(0.05 + n * 0.05, 0.45);
  grid.forEach((row, r) => row.forEach((ch, c) => {
    if (ch === '.') return;
    const hp = (n >= 2 && Math.random() < hardP) ? 2 : 1;
    bricks.push({
      x: SIDE + c * (bw + GAP), y: TOP + r * (bh + GAP), w: bw, h: bh,
      color: PALETTE[r % PALETTE.length], hp, maxHp: hp, flash: 0, alive: true
    });
  }));
}

// ---------------- entities ----------------
function makeStuckBall(){ return { x: paddle.x, y: paddle.y - 14, vx: 0, vy: 0, r: 7, stuck: true, trail: [] }; }

const POWER_TYPES = [
  { id: 'expand', char: 'E', color: '#00e5ff' },
  { id: 'multi',  char: 'M', color: '#b8ff2d' },
  { id: 'slow',   char: 'S', color: '#ffb400' },
  { id: 'life',   char: '+', color: '#ff2d95' }
];
const POWER_WEIGHTS = [3, 3, 2, 1];

function dropPower(x, y){
  const total = POWER_WEIGHTS.reduce((a, b) => a + b, 0);
  let roll = Math.random() * total;
  for (let i = 0; i < POWER_TYPES.length; i++){
    roll -= POWER_WEIGHTS[i];
    if (roll <= 0){ powerups.push({ x, y, vy: 150, type: POWER_TYPES[i] }); return; }
  }
}

function burst(x, y, color, n = 14){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 320;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: .45 + Math.random() * .4, t: 0, color, size: 1.5 + Math.random() * 3 });
  }
}

// ---------------- flow ----------------
function addScore(n){
  score += n;
  if (score > hi) hi = score;
  syncHud();
}
function startGame(){
  score = 0; lives = 3; level = 1; speed = 340; expandT = 0; slowT = 0;
  paddle.w = 120;
  buildLevel(1);
  balls = [makeStuckBall()];
  state = S.READY; paused = false;
  hideOverlay(); syncHud();
}
function launch(){
  for (const b of balls) if (b.stuck){
    const th = Math.random() * 0.9 - 0.45;
    b.vx = Math.sin(th) * speed;
    b.vy = -Math.cos(th) * speed;
    b.stuck = false;
  }
  state = S.PLAYING; sfx.paddle();
}
function gameOver(){
  state = S.OVER;
  try { localStorage.setItem('neonBreakerHi', String(hi)); } catch(e){ /* noop */ }
  sfx.over(); syncHud();
  showOverlay('GAME OVER', 'Final score <span class="big">' + score + '</span><br>Best: ' + hi + ' — press Space to retry', '#ff2d95');
}
function nextLevel(){
  level++; speed = Math.min(speed + 30, 560); expandT = 0; slowT = 0; paddle.w = 120;
  buildLevel(level);
  balls = [makeStuckBall()];
  state = S.READY; syncHud(); hideOverlay();
}
function loseLife(){
  lives--; shake = 7; sfx.lose(); syncHud();
  powerups = []; expandT = 0; slowT = 0; paddle.w = 120;
  if (lives <= 0){ gameOver(); return; }
  balls = [makeStuckBall()];
  state = S.READY;
}
function showOverlay(title, sub, color, ghost){
  overlay.classList.remove('hidden');
  overlay.classList.toggle('ghost', !!ghost);
  overlay.style.setProperty('--c', color || '#00e5ff');
  overlay.innerHTML = '<h1>' + title + '</h1><p>' + sub + '</p>';
}
function hideOverlay(){ overlay.classList.add('hidden'); }

function syncHud(){
  elScore.textContent = score;
  elHi.textContent = hi;
  elLevel.textContent = 'Level ' + level;
  elLives.textContent = lives > 0 ? '\u25CF'.repeat(lives) : '';
}

// ---------------- physics ----------------
function collideWalls(b){
  if (b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx); }
  else if (b.x + b.r > W){ b.x = W - b.r; b.vx = -Math.abs(b.vx); }
  if (b.y - b.r < 0){ b.y = b.r; b.vy = Math.abs(b.vy); }
}
function collidePaddle(b, effSpeed){
  if (b.vy <= 0) return;
  if (b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h && Math.abs(b.x - paddle.x) <= paddle.w / 2 + b.r){
    const rel = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w / 2)));
    const th = rel * 1.05;
    speed = Math.min(speed + 4, 560);
    b.vx = Math.sin(th) * effSpeed;
    b.vy = -Math.cos(th) * effSpeed;
    b.y = paddle.y - b.r - 0.5;
    sfx.paddle();
  }
}
function hitBrick(br){
  br.hp--; br.flash = .12;
  if (br.hp <= 0){
    br.alive = false;
    addScore(20);
    burst(br.x + br.w / 2, br.y + br.h / 2, br.color);
    shake = Math.min(shake + 2.5, 8);
    sfx.brick();
    if (Math.random() < 0.16) dropPower(br.x + br.w / 2, br.y + br.h / 2);
  } else {
    addScore(5); sfx.hard();
  }
}
function collideBricks(b){
  for (const br of bricks){
    if (!br.alive) continue;
    const cx = Math.max(br.x, Math.min(b.x, br.x + br.w));
    const cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
    const dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy > b.r * b.r) continue;
    const bcx = br.x + br.w / 2, bcy = br.y + br.h / 2;
    const ox = (br.w / 2 + b.r) - Math.abs(b.x - bcx);
    const oy = (br.h / 2 + b.r) - Math.abs(b.y - bcy);
    if (ox < oy){
      const s = Math.sign(b.x - bcx) || 1;
      b.vx = s * Math.abs(b.vx);
      b.x = bcx - s * (br.w / 2 + b.r);
    } else {
      const s = Math.sign(b.y - bcy) || 1;
      b.vy = s * Math.abs(b.vy);
      b.y = bcy - s * (br.h / 2 + b.r);
    }
    hitBrick(br);
    return true;
  }
  return false;
}

function applyPower(id){
  if (id === 'expand') expandT = Math.max(expandT, 9);
  else if (id === 'slow') slowT = Math.max(slowT, 6);
  else if (id === 'life'){ lives = Math.min(lives + 1, 5); sfx.life(); syncHud(); }
  else if (id === 'multi'){
    const src = balls.find(b => !b.stuck) || null;
    for (let k = 0; k < 2 && src && balls.length < 12; k++){
      const nb = { x: src.x, y: src.y, vx: src.vx, vy: src.vy, r: src.r, stuck: false, trail: [] };
      const sp = Math.hypot(nb.vx, nb.vy) || speed;
      const a = Math.atan2(nb.vy, nb.vx) + (k === 0 ? 0.5 : -0.5);
      nb.vx = Math.cos(a) * sp; nb.vy = Math.sin(a) * sp;
      balls.push(nb);
    }
  }
}

// ---------------- update ----------------
function update(dt){
  const targetW = 120 + (expandT > 0 ? 70 : 0);
  paddle.w += (targetW - paddle.w) * Math.min(1, dt * 8);
  if (expandT > 0) expandT -= dt;
  if (slowT > 0) slowT -= dt;

  const pv = 950;
  if (keys.left || keys.right){
    paddle.x += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * pv * dt;
    pointerX = paddle.x; // keyboard owns the paddle: don't snap back to stale mouse position
  } else {
    paddle.x += (pointerX - paddle.x) * Math.min(1, dt * 20);
  }
  paddle.x = Math.max(SIDE + paddle.w / 2, Math.min(W - SIDE - paddle.w / 2, paddle.x));

  if (state === S.READY){
    for (const b of balls) if (b.stuck){ b.x = paddle.x; b.y = paddle.y - b.r - 7; }
  }

  const effSpeed = speed * (slowT > 0 ? 0.62 : 1);

  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    if (b.stuck) continue;
    let sp = Math.hypot(b.vx, b.vy);
    if (sp > 0){ b.vx = b.vx / sp * effSpeed; b.vy = b.vy / sp * effSpeed; }
    const steps = 2;
    for (let s = 0; s < steps; s++){
      b.x += b.vx * dt / steps;
      b.y += b.vy * dt / steps;
      collideWalls(b);
      collidePaddle(b, effSpeed);
      collideBricks(b);
    }
    if (Math.abs(b.vy) < effSpeed * 0.25){
      const s = b.vy === 0 ? -1 : Math.sign(b.vy);
      b.vy = s * effSpeed * 0.3;
      sp = Math.hypot(b.vx, b.vy);
      b.vx = b.vx / sp * effSpeed; b.vy = b.vy / sp * effSpeed;
    }
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 12) b.trail.shift();
    if (b.y - b.r > H){ balls.splice(i, 1); burst(b.x, H - 6, '#ff2d95', 8); }
  }

  for (let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.y += p.vy * dt;
    if (p.y > H + 20){ powerups.splice(i, 1); continue; }
    if (state === S.PLAYING && p.y + 9 >= paddle.y && p.y <= paddle.y + paddle.h + 9 && Math.abs(p.x - paddle.x) <= paddle.w / 2 + 10){
      applyPower(p.type.id);
      addScore(50); sfx.power();
      powerups.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.t += dt;
    if (p.t > p.life){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt;
  }

  for (const br of bricks) if (br.flash > 0) br.flash -= dt;
  shake = Math.max(0, shake - dt * 14);

  if (state === S.PLAYING && balls.length === 0){ loseLife(); return; }
  if (state === S.CLEAR){ clearT -= dt; if (clearT <= 0) nextLevel(); }
  if (state === S.PLAYING && bricks.every(b => !b.alive)){
    state = S.CLEAR; clearT = 1.6; sfx.clear();
    showOverlay('LEVEL ' + level + ' CLEAR', 'Next wave incoming\u2026', '#2dffc4', true);
  }
}

// ---------------- draw ----------------
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#070a18';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(90,130,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 40; x < W; x += 40){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 40; y < H; y += 40){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  ctx.save();
  ctx.translate(sx, sy);

  for (const br of bricks){
    if (!br.alive) continue;
    ctx.shadowColor = br.color; ctx.shadowBlur = 12;
    ctx.globalAlpha = br.maxHp > 1 ? 0.95 : 0.8;
    ctx.fillStyle = br.color;
    roundRect(ctx, br.x, br.y, br.w, br.h, 5);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (br.maxHp > 1){
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
      roundRect(ctx, br.x + 4, br.y + 4, br.w - 8, br.h - 8, 3);
      ctx.stroke();
    }
    if (br.flash > 0){
      ctx.globalAlpha = Math.min(1, br.flash * 6);
      ctx.fillStyle = '#fff';
      roundRect(ctx, br.x, br.y, br.w, br.h, 5);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  for (const p of powerups){
    ctx.shadowColor = p.type.color; ctx.shadowBlur = 10;
    ctx.fillStyle = 'rgba(10,14,30,.9)';
    roundRect(ctx, p.x - 12, p.y - 9, 24, 18, 6);
    ctx.fill();
    ctx.strokeStyle = p.type.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = p.type.color;
    ctx.font = 'bold 12px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.type.char, p.x, p.y + 1);
  }

  const pw = paddle.w;
  const grad = ctx.createLinearGradient(paddle.x - pw / 2, 0, paddle.x + pw / 2, 0);
  grad.addColorStop(0, '#00e5ff'); grad.addColorStop(.5, '#7df9ff'); grad.addColorStop(1, '#00e5ff');
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 16;
  ctx.fillStyle = grad;
  roundRect(ctx, paddle.x - pw / 2, paddle.y, pw, paddle.h, 7);
  ctx.fill();

  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles){
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * a + .5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;

  for (const b of balls){
    for (let i = 0; i < b.trail.length; i++){
      const t = b.trail[i];
      ctx.globalAlpha = (i + 1) / b.trail.length * .3;
      ctx.fillStyle = '#7df9ff';
      ctx.beginPath(); ctx.arc(t.x, t.y, b.r * ((i + 1) / b.trail.length), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }

  if (paused){
    ctx.shadowColor = '#ffb400'; ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff';
    ctx.font = '600 34px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ---------------- loop ----------------
let last = performance.now();
function frame(now){
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  if (!paused && state !== S.MENU && state !== S.OVER) update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------------- input ----------------
function toCanvasX(clientX){
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
window.addEventListener('pointermove', e => { pointerX = toCanvasX(e.clientX); });
window.addEventListener('pointerdown', e => { if (e.target === muteBtn) return; ensureAudio(); primary(); });
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function primary(){
  ensureAudio();
  if (paused){ paused = false; return; }
  if (state === S.MENU || state === S.OVER) startGame();
  else if (state === S.READY) launch();
}

addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  else if (e.code === 'Space'){ e.preventDefault(); primary(); }
  else if (e.code === 'KeyP'){ if (state === S.PLAYING || state === S.READY) paused = !paused; }
  else if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

function toggleMute(){
  muted = !muted;
  muteBtn.textContent = muted ? '\u{1F507}' : '\u{1F50A}';
}
muteBtn.addEventListener('click', () => { ensureAudio(); toggleMute(); });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === S.PLAYING || state === S.READY)) paused = true;
});

window.addEventListener('error', e => { document.title = 'JS ERROR: ' + (e.message || 'unknown'); });

syncHud();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
